{% extends "base.html" %}
{% block title %}Получатель{% endblock %}
{% block content %}
<h1>{% if object %}Редактирование{% else %}Новый{% endif %} получатель</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Сохранить</button>
    <a class="btn secondary" href="{% url 'clients:client_list' %}">Отмена</a>
</form>
{% endblock %}
